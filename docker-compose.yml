# =============================================================================
# Data Pipeline - Unified Docker Compose
# =============================================================================
# Usage:
#   make up                    - Start Kafka infrastructure + consumers
#   make up-airflow            - Start full stack including Airflow
#   docker compose --profile airflow up -d  - Alternative to above
#
# Profiles:
#   (default)  - Kafka infrastructure only (zookeeper, kafka, kafka-ui, init-kafka)
#   consumers  - Kafka consumers (trade-consumer)
#   airflow    - Airflow services (postgres, webserver, scheduler)
# =============================================================================

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: custom-airflow:2.7.3-python3.10
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
    # Snowflake (from .env)
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-DATAPIPELINE_WH}
    SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-DATAPIPELINE}
    SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-TRADES}
    SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-SYSADMIN}
    # dbt paths
    DBT_PROJECT_DIR: /opt/dbt/market_data_platform
    DBT_PROFILES_DIR: /opt/dbt
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/utils:/opt/airflow/dags/utils
    - ./airflow/logs:/opt/airflow/logs
    - ./dbt/market_data_platform:/opt/dbt/market_data_platform
    - ./airflow/dbt_profiles:/opt/dbt
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - pipeline
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ===========================================================================
  # KAFKA INFRASTRUCTURE (default profile)
  # ===========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - pipeline

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - pipeline
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trades_topic --partitions 3 --replication-factor 1
      echo 'Topics created successfully!'
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  # ===========================================================================
  # CONSUMERS (--profile consumers)
  # ===========================================================================
  trade-consumer:
    profiles:
      - consumers
    build:
      context: ./consumers
      dockerfile: Dockerfile
      args:
        CONSUMER_MODULE: trades
    container_name: trade-consumer
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRADES_TOPIC: trades_topic
      TRADES_GROUP_ID: trade_consumer_group
      TRADES_SCHEMA_PATH: /app/configs/schemas/trade_schema.avsc
      TRADES_OUTPUT_DIR: /app/data/trades
      FLUSH_INTERVAL_SECONDS: 30
      # S3 configuration (from .env)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-trades}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DELETE_LOCAL_AFTER_UPLOAD: ${DELETE_LOCAL_AFTER_UPLOAD:-false}
    volumes:
      - ./configs/schemas:/app/configs/schemas:ro
      - ./data/trades:/app/data/trades
    networks:
      - pipeline
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # AIRFLOW (--profile airflow)
  # ===========================================================================
  postgres:
    profiles:
      - airflow
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    profiles:
      - airflow
    container_name: airflow-init
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true
        echo "Airflow initialized successfully!"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    profiles:
      - airflow
    container_name: airflow-webserver
    command: bash -c "airflow webserver"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    profiles:
      - airflow
    container_name: airflow-scheduler
    command: bash -c "airflow scheduler"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

networks:
  pipeline:
    name: datapipeline_network
    driver: bridge

volumes:
  postgres-db-volume:
