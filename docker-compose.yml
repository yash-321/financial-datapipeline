# =============================================================================
# Data Pipeline - Docker Compose
# =============================================================================
# Usage:
#   make up              - Start Kafka infrastructure
#   make up-floci        - Start Floci AWS emulator + Floci UI
#   make up-consumers    - Start Kafka + trade consumer
#   docker compose up -d - Start Kafka infrastructure
#
# Profiles:
#   (default)  - Kafka infrastructure (zookeeper, kafka, kafka-ui, init-kafka)
#   floci      - Floci AWS emulator + Floci UI
#   consumers  - Kafka consumers profile (includes Floci + Floci UI + trade-consumer)
#
# Architecture:
#   Producer → Kafka → Consumer → S3 Landing Bucket (Parquet)
#   Future: Spark jobs will read landing bucket and write to Iceberg tables
# =============================================================================

services:
  # ===========================================================================
  # KAFKA INFRASTRUCTURE (default profile)
  # ===========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - pipeline

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - pipeline
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trades_topic --partitions 3 --replication-factor 1
      echo 'Topics created successfully!'
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  # ===========================================================================
  # AWS EMULATOR (--profile consumers)
  # ===========================================================================
  floci:
    profiles:
      - consumers
      - floci
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: ${FLOCI_STORAGE_MODE:-hybrid}
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./floci-data:/app/data
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  floci-ui:
    profiles:
      - consumers
      - floci
    image: floci/floci-ui:latest
    container_name: floci-ui
    ports:
      - "4500:4500"
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    networks:
      - pipeline
    depends_on:
      floci:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # CONSUMERS (--profile consumers)
  # ===========================================================================
  trade-consumer:
    profiles:
      - consumers
    build:
      context: ./consumers
      dockerfile: Dockerfile
      args:
        CONSUMER_MODULE: trades
    container_name: trade-consumer
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRADES_TOPIC: trades_topic
      TRADES_GROUP_ID: trade_consumer_group
      TRADES_SCHEMA_PATH: /app/configs/schemas/trade_schema.avsc
      TRADES_OUTPUT_DIR: /app/data/trades
      FLUSH_INTERVAL_SECONDS: 30
      # S3 configuration (from .env)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-trades}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ENDPOINT_URL: http://floci:4566
      DELETE_LOCAL_AFTER_UPLOAD: ${DELETE_LOCAL_AFTER_UPLOAD:-false}
    volumes:
      - ./configs/schemas:/app/configs/schemas:ro
      - ./data/trades:/app/data/trades
    networks:
      - pipeline
    depends_on:
      kafka:
        condition: service_healthy
      floci:
        condition: service_healthy
    restart: unless-stopped

networks:
  pipeline:
    name: datapipeline_network
    driver: bridge